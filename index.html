
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Hub Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:white;font-family:Arial,sans-serif}
header{background:#191b23;padding:17px;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0;color:#ff3155}
button{background:#ff3155;color:white;border:0;padding:11px 15px;border-radius:7px;cursor:pointer;margin:4px}
button:disabled{opacity:.5}
input{width:100%;padding:13px;margin:8px 0;background:#222530;color:white;border:1px solid #444;border-radius:7px}
#login{max-width:380px;margin:70px auto;padding:20px;background:#191b23;border-radius:12px}
#app{display:none}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px;background:#191b23}
nav button{white-space:nowrap;background:#30333e}
nav button.active{background:#ff3155}
main{padding:15px;max-width:1100px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card,.panel{background:#1b1e27;padding:17px;border-radius:10px;margin-bottom:12px}
.card strong{display:block;font-size:25px;margin-top:10px}
.item{background:#20232d;padding:13px;border-radius:8px;margin:9px 0;overflow-wrap:anywhere}
.small{color:#aaa;font-size:13px}
.danger{background:#b52238}
.green{background:#16834c}
#message{padding:10px;color:#ffca70;white-space:pre-wrap}
@media(min-width:700px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
<h2>X HUB ADMIN</h2>
<button onclick="logout()">Logout</button>
</header>

<div id="login">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button style="width:100%" onclick="login()">Login</button>
<div id="loginMsg"></div>
</div>

<div id="app">
<nav>
<button class="active" onclick="showPage('dashboard',this)">Dashboard</button>
<button onclick="showPage('users',this)">Users</button>
<button onclick="showPage('creators',this)">Creators</button>
<button onclick="showPage('videos',this)">Videos</button>
<button onclick="showPage('reports',this)">Reports</button>
<button onclick="showPage('subscribers',this)">Subscribers</button>
</nav>

<main>
<div id="message"></div>

<section id="dashboard">
<h2>Dashboard Statistics</h2>
<div class="cards">
<div class="card">Total Users<strong id="totalUsers">0</strong></div>
<div class="card">Total Videos<strong id="totalVideos">0</strong></div>
<div class="card">Creators<strong id="totalCreators">0</strong></div>
<div class="card">Subscribers<strong id="totalSubs">0</strong></div>
</div>
<button onclick="refreshAll()">Refresh Dashboard</button>
</section>

<section id="users" hidden>
<h2>User List</h2>
<div id="userList"></div>
</section>

<section id="creators" hidden>
<h2>Creator List</h2>
<div id="creatorList"></div>
</section>

<section id="videos" hidden>
<h2>Video Management</h2>
<div id="videoList"></div>
</section>

<section id="reports" hidden>
<h2>Video Reports</h2>
<div id="reportList"></div>
</section>

<section id="subscribers" hidden>
<h2>Subscribers</h2>
<div id="subscriberList"></div>
</section>
</main>
</div>

<script>
const SUPABASE_URL = "https://scczyiossqleuzidplxx.supabase.co";
const SUPABASE_KEY = "sb_publishable_rvecUf_3ZkeAxnbAJ8iiiw_2mItGPT2";

const sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser = null;

const $ = id => document.getElementById(id);

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function message(text){
 $("message").textContent = text;
}

async function login(){
 $("loginMsg").textContent="Checking login...";
 const email=$("email").value.trim();
 const password=$("password").value;

 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error){
  $("loginMsg").textContent=error.message;
  return;
 }
 currentUser=data.user;
 await checkAdmin();
}

async function checkAdmin(){
 const {data,error}=await sb
  .from("admin_users")
  .select("user_id")
  .eq("user_id",currentUser.id)
  .maybeSingle();

 if(error || !data){
  await sb.auth.signOut();
  currentUser=null;
  $("loginMsg").textContent="You are not an authorized admin.";
  return;
 }

 $("login").style.display="none";
 $("app").style.display="block";
 message("Admin login successful.");
 refreshAll();
}

async function logout(){
 await sb.auth.signOut();
 currentUser=null;
 $("app").style.display="none";
 $("login").style.display="block";
 $("password").value="";
}

function showPage(page,btn){
 document.querySelectorAll("main section").forEach(s=>s.hidden=true);
 $(page).hidden=false;
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");

 if(page==="users") loadUsers();
 if(page==="creators") loadCreators();
 if(page==="videos") loadVideos();
 if(page==="reports") loadReports();
 if(page==="subscribers") loadSubscribers();
}

async function countRows(table){
 const {count,error}=await sb.from(table).select("*",{count:"exact",head:true});
 if(error) throw error;
 return count||0;
}

async function refreshAll(){
 try{
  const [users,videos,creators,subs]=await Promise.all([
   countRows("profiles"),
   countRows("videos"),
   countRows("profiles"),
   countRows("subscriptions")
  ]);
  $("totalUsers").textContent=users;
  $("totalVideos").textContent=videos;
  $("totalCreators").textContent=creators;
  $("totalSubs").textContent=subs;
  message("Dashboard updated.");
 }catch(e){
  message("Dashboard error: "+e.message);
 }
}

async function loadUsers(){
 $("userList").textContent="Loading...";
 const {data,error}=await sb.from("profiles").select("*").limit(200);
 if(error){$("userList").textContent=error.message;return;}
 $("userList").innerHTML=(data||[]).map(u=>`
 <div class="item">
 <b>${safe(u.username||u.name||"User")}</b>
 <div class="small">User ID: ${safe(u.user_id||u.id)}</div>
 </div>`).join("") || "No users found.";
}

async function loadCreators(){
 $("creatorList").textContent="Loading...";
 const {data,error}=await sb.from("profiles").select("*").limit(200);
 if(error){$("creatorList").textContent=error.message;return;}
 $("creatorList").innerHTML=(data||[]).map(u=>`
 <div class="item">
 <b>${safe(u.username||u.name||"Creator")}</b>
 <div class="small">User ID: ${safe(u.user_id||u.id)}</div>
 </div>`).join("") || "No creators found.";
}

async function loadVideos(){
 $("videoList").textContent="Loading...";
 const {data,error}=await sb.from("videos").select("*").order("id",{ascending:false}).limit(200);
 if(error){$("videoList").textContent=error.message;return;}
 $("videoList").innerHTML=(data||[]).map(v=>`
 <div class="item">
 <b>${safe(v.title||"Untitled Video")}</b>
 <div class="small">Video ID: ${safe(v.id)}</div>
 <div class="small">Views: ${safe(v.views??0)}</div>
 <button class="danger" onclick="deleteVideo('${safe(v.id)}')">Delete Video</button>
 </div>`).join("") || "No videos found.";
}

async function deleteVideo(id){
 if(!confirm("Are you sure you want to delete this video record?"))return;
 const {error}=await sb.from("videos").delete().eq("id",id);
 if(error){message("Delete failed: "+error.message);return;}
 message("Video record deleted.");
 loadVideos();
 refreshAll();
}

async function loadReports(){
 $("reportList").textContent="Loading...";
 const {data,error}=await sb.from("video_reports").select("*").order("created_at",{ascending:false}).limit(200);
 if(error){$("reportList").textContent=error.message;return;}
 $("reportList").innerHTML=(data||[]).map(r=>`
 <div class="item">
 <b>Report: ${safe(r.reason)}</b>
 <div class="small">Video ID: ${safe(r.video_id)}</div>
 <div class="small">Status: ${safe(r.status)}</div>
 <button class="green" onclick="updateReport('${safe(r.id)}','reviewed')">Mark Reviewed</button>
 <button onclick="updateReport('${safe(r.id)}','resolved')">Resolve</button>
 <button class="danger" onclick="updateReport('${safe(r.id)}','rejected')">Reject</button>
 </div>`).join("") || "No reports found.";
}

async function updateReport(id,status){
 const {error}=await sb.from("video_reports").update({status}).eq("id",id);
 if(error){message("Update failed: "+error.message);return;}
 message("Report status updated.");
 loadReports();
}

async function loadSubscribers(){
 $("subscriberList").textContent="Loading...";
 const {data,error}=await sb.from("subscriptions").select("*").limit(200);
 if(error){$("subscriberList").textContent=error.message;return;}
 $("subscriberList").innerHTML=(data||[]).map(s=>`
 <div class="item">
 <b>Subscription</b>
 <div class="small">Subscriber ID: ${safe(s.user_id||s.subscriber_id)}</div>
 <div class="small">Channel ID: ${safe(s.channel_id)}</div>
 </div>`).join("") || "No subscribers found.";
}

sb.auth.getSession().then(async ({data})=>{
 if(data.session){
  currentUser=data.session.user;
  await checkAdmin();
 }
});
</script>
</body>
</html>
